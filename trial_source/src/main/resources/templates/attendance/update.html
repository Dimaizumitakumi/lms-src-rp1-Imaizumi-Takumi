<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				<table class="table table-hover dataTable no-footer">
					<!-- 今泉拓巳 task29 theadタグにstyle="display: block;"追加 -->
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<!-- 今泉拓巳 task26 w140へ変更 -->
							<th class="w140">コース内容</th>
							<!-- 今泉拓巳 task28 定時ボタン用列追加 -->
							<th class="w60"></th>
							<!-- 今泉拓巳 task26 colspan追加 -->
							<th class="w180" colspan="3">出勤</th>
							<!-- 今泉拓巳 task26 colspan追加 -->
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<!-- 今泉拓巳 task29 tbodyタグにstyle="display: block; overflow-y: scroll; height: 560px;"追加 -->
					<tbody style="display: block; overflow-y: scroll; height: 560px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<!-- 今泉拓巳 task26 w140へ変更 -->
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<!-- 今泉拓巳 task28 定時ボタン追加 -->
								<td class="w60"><input type="button" class="btn btn-success" value="定時" th:onclick="|setTime(${stat.index})|" /></td>
								<!-- 今泉拓巳 task26 プルダウン方式へ変更ここから -->
								<!-- 今泉拓巳 task28 scriptのためselectタグにid追加ここから -->
								<td class="w70">
									<select th:id="|startHour_${stat.index}|" th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}" th:inlne="text" class="form-control" 
											th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">[[${hour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:id="|startMinute_${stat.index}|" th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}" th:inlne="text" class="form-control" 
											th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${minute.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<select th:id="|endHour_${stat.index}|" th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}" th:inlne="text" class="form-control" 
											th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">[[${hour.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:id="|endMinute_${stat.index}|" th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}" th:inlne="text" class="form-control" 
											th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${minute.value}]]</option>
									</select>
								</td>
								<!-- 今泉拓巳 task28 scriptのためselectタグにid追加ここから -->
								<!-- 今泉拓巳 task26 プルダウン方式へ変更ここまで -->
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>
	
	<!-- 今泉拓巳 task28 scriptタグ追加 -->
	<script>
		function setTime(index) {
			document.getElementById("startHour_" + index).selectedIndex = 10; 
			document.getElementById("startMinute_" + index).selectedIndex = 1;
			document.getElementById("endHour_" + index).selectedIndex = 19;
			document.getElementById("endMinute_" + index).selectedIndex = 1;
		}
	</script>

</body>
</html>
